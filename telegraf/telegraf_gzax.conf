[agent]
  interval = "10s"
  flush_interval = "60s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
[[inputs.diskio]]
[[inputs.kernel]]
[[inputs.mem]]
[[inputs.processes]]
[[inputs.system]]
  fielddrop = ["uptime_format"]
[[inputs.net]]
  ignore_protocol_stats = true

[[aggregators.basicstats]]
  period = "60s"
  drop_original = true
  stats = ["mean"]

[[processors.rename]]
  [[processors.rename.replace]]
    field = "usage_idle_mean"
    dest = "usage_idle"
  [[processors.rename.replace]]
    field = "usage_user_mean"
    dest = "usage_user"
