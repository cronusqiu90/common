[[outputs.amqp]]
  brokers = ["amqp:/AMQP_DSN//gz"]
  max_messages = 10
  exchange = "telegraf"
  exchange_type = "topic"
  exchange_durability = "durable"
  username = "telegraf"
  password = "AMQP_PWD"
  auth_method = "PLAIN"
  routing_key = "telegraf"
  delivery_mode = "transient"
  data_format = "json"
